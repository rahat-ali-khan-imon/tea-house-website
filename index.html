<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tea House</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Font Awesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap" rel="stylesheet">
    <style>
        * {
            font-family: "Manrope", sans-serif;
        }
    </style>
</head>

<body>
    <!-- Banner Section -->
    <section class="grid grid-cols-2 container mx-auto mt-16">
        <div class="banner-left space-y-7">
            <h2 class="text-[80px] font-extrabold text-[#1c1c1c] leading-24">
                It's good <br> tea time at The <br> Tea House
            </h2>
            <p class="text-[18px] font-medium text-[#777777] leading-7">
                Tea and Botanical Solutions Supplier Give Optimum <br> Satisfaction To Your Taste Buds.
            </p>
            <button class="bg-linear-to-r from-[#ff8938] to-[#ff0000] px-6 py-4 rounded-[10px]">
                <span class="text-[20px] font-bold text-[#ffffff]">Explore More</span> 
                <span class="text-white -rotate-45 inline-block"><i class="fa-solid fa-arrow-right-long"></i></span>
            </button>
        </div>

        <div class="banner-right">
            <img src="./images/banner.png" alt="">
        </div>
    </section>
</body>

</html>
